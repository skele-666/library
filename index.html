<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Library</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body>
  <header>
    <h1>Book Library</h1>
    <p>Manage your personal book collection</p>
  </header>
  <div class="container">
    <div id="library">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Read</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="book-list">
          <!-- Books will be dynamically added here -->
        </tbody>
      </table>
    </div>

    <button id="new-book-btn">Add New Book</button>
    <form id="book-form">
      <input type="text" id="title" placeholder="Title" required>
      <input type="text" id="author" placeholder="Author" required>
      <input type="number" id="pages" placeholder="Pages" required min="1">
      <label for="read-check">Have you read this book?</label>
      <input type="checkbox" id="read-check">
      <button type="submit" id="submit">Submit</button>
    </form>
  </div>
</body>

</html>
